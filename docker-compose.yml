# Runs the whole app (frontend + API in one container) on http://localhost:8000.
#
#   docker compose up --build -d
#   docker compose logs -f
#   docker compose down
#
# Settings come from the .env file next to this file (copy .env.example); at
# least ANTHROPIC_API_KEY must be set. PORT_ON_HOST moves the host port if 8000
# is taken. Railway ignores this file and builds the Dockerfile itself.

name: medai

services:
  app:
    build: .
    image: medai
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
    ports:
      - "${PORT_ON_HOST:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
